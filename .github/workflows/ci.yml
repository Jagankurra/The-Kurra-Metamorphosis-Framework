name: The Kurra Matrix Engine CI Pipeline

on:
  push:
    branches: [ "main", "master", "release/*" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build-and-validate-spec:
    name: C++ Compilation & Boundary Verification
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential g++-12

    - name: Verify All Headers & Compile Shared Library
      env:
        CXX: g++-12
      run: |
        $CXX -O3 -std=c++17 -Wall -Wextra -fsyntax-only opt/edge/matrix/bin/Avx512TensorProcessor.hpp
        $CXX -O3 -std=c++17 -Wall -Wextra -fsyntax-only opt/edge/matrix/bin/KurraPrometheusExporter.hpp
        $CXX -O3 -std=c++17 -Wall -Wextra -fPIC -shared opt/edge/matrix/bin/TensorBridge.cpp -o libtensorbridge.so

    - name: Compile Hardened Linux Edge Daemon
      env:
        CXX: g++-12
      run: |
        $CXX -O3 -std=c++17 -Wall -Wextra -pthread opt/edge/matrix/bin/MatrixDaemon.cpp -lrt -o kurra_daemon

    - name: Compile & Run Boundary Unit Tests
      env:
        CXX: g++-12
      run: |
        $CXX -O3 -std=c++17 -Wall -Wextra -pthread SystemicCoreUnitTests.cpp -o kurra_test_runner
        ./kurra_test_runner
