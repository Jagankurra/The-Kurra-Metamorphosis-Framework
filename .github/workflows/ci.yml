name: The Kurra Matrix Engine CI Pipeline

on:
  push:
    branches: [ "main", "master", "release/*" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build-and-validate-spec:
    name: Micro-Architectural Compilation & Boundary Verification
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Data Repository
      uses: actions/checkout@v4

    - name: Bootstrap High-Performance Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential g++-12 libstdc++6-12-dev

    - name: Verify Micro-Architectural Instruction Support Compiler Flags
      run: |
        echo "=== CHECKING COMPILER ARCHITECTURAL METRICS ==="
        $CXX --version
        
    - name: Compile High-Velocity Shared Object Library Layer
      env:
        CXX: g++-12
      run: |
        $CXX -O3 -std=c++17 -Wall -Wextra -fPIC -shared opt/edge/matrix/bin/TensorBridge.cpp -o libtensorbridge.so

    - name: Compile Zero-Allocation Validation Test Harness
      env:
        CXX: g++-12
      run: |
        $CXX -O3 -std=c++17 -Wall -Wextra -pthread SystemicCoreUnitTests.cpp -o kurra_test_runner

    - name: Execute Boundary Crossing Verification Suite
      run: |
        echo "=== RUNNING CORE STRUCTURAL VERIFICATION LOOPS ==="
        ./kurra_test_runner
